server:
  port: 8088

spring:
  application:
    name: hm-ai
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:mysql://localhost:3315/hm-item?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: HouAN123
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        # 本地无 Nacos 时也能启动，便于独立调试 AI 能力
        enabled: false
  ai:
    openai:
      base-url: ${hm.ai.vertex.openai-base-url}

# Vertex AI 配置
hm:
  ai:
    vertex:
      project-id: rag-fist
      location: global
      model: google/gemini-3.6-flash
      adc-path: ${user.home}/.config/gcloud/application_default_credentials.json
      max-tokens: 2048
      temperature: 0.7
    memory:
      max: 100

logging:
  level:
    com.hmall.ai: debug
    org.springframework.ai: debug
